[project]
name = "esper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sentence-transformers>=6.1.0",
    "sqlite-vec>=0.1.9",
    "torch>=2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# using only CPU
[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esper"]